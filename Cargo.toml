[workspace]
members  = ["cli/*", "lib/*", "proc/*"]
resolver = "3"

[workspace.package]
version    = "0.1.0"
edition    = "2024"
license    = "MIT"
repository = "https://github.com/godilov/nd-libr"
homepage   = "https://github.com/godilov/nd-libr"
authors    = ["German Odilov <godilov@tuta.io>"]
categories = ["mathematics", "cryptography", "memory management"]
keywords   = ["math", "cryptography", "nums", "mem"]
readme     = "README.md"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code  = "deny"

[workspace.lints.clippy]
panic                   = { level = "deny", priority = 127 }
unwrap_used             = { level = "deny", priority = 126 }
expect_used             = { level = "deny", priority = 125 }
cargo                   = { level = "warn", priority = -1 }
multiple_crate_versions = { level = "allow", priority = 0 }

[workspace.dependencies]
alloy              = "2.0"
alloy-primitives   = "1.6"
anyhow             = "1.0"
clap               = "4.6"
rand               = "0.10"
rayon              = "1.12"
serde              = "1.0"
serde_json         = "1.0"
thiserror          = "2.0"
tokio              = "1.52"
tracing            = "0.1"
tracing-subscriber = "0.3"
zerocopy           = "0.8"

proc-macro2 = "1.0"
quote       = "1.0"
syn         = "2.0"

criterion = "0.8"

ndasm    = { path = "proc/asm" }
ndassert = { path = "proc/assert" }
ndfwd    = { path = "proc/fwd" }
ndops    = { path = "proc/ops" }

ndcrypto = { path = "lib/crypto" }
ndevm    = { path = "lib/evm" }
ndext    = { path = "lib/ext" }
ndlibr   = { path = "lib/libr" }
ndmem    = { path = "lib/mem" }
ndnum    = { path = "lib/num" }

ndprimes = { path = "cli/primes" }

[profile.release]
codegen-units = 1
panic         = "abort"
lto           = true
